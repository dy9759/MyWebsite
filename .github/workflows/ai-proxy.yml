name: Deploy AI proxy (Cloudflare Worker)

# Deploys workers/ai-proxy. Secrets (Settings → Secrets and variables →
# Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BAILIAN_API_KEY.
# The Bailian key is written into the Worker's encrypted secrets — it is
# never part of the site build or any file in this repository.
on:
  push:
    branches: [main]
    paths:
      - "workers/ai-proxy/**"
      - ".github/workflows/ai-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ai-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/ai-proxy/package-lock.json

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy

      - name: Store the Bailian key as a Worker secret
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
        run: |
          if [ -z "$BAILIAN_API_KEY" ]; then
            echo "::warning::BAILIAN_API_KEY secret is not set; the proxy will answer 503 until it is."
            exit 0
          fi
          printf '%s' "$BAILIAN_API_KEY" | npx wrangler secret put BAILIAN_API_KEY
