name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight: a newer push queues behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'server/wiki-chat/*.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build static export
        run: npm run build
        env:
          # Public GA4 measurement id — injected only for the production
          # deploy so forks and local builds don't pollute analytics.
          NEXT_PUBLIC_GA_ID: G-32FLEBL3F6
          # Wiki chat backend URL (…/chat). Normally left empty: the public
          # site then lets visitors bring their own Bailian key (or shows demo
          # replies). Set the WIKI_API_URL repository variable only if a
          # server/wiki-chat instance is publicly deployed.
          NEXT_PUBLIC_WIKI_API_URL: ${{ vars.WIKI_API_URL }}
          # AI proxy for the reading features (workers/ai-proxy), e.g.
          # https://books-ai-proxy.<account>.workers.dev/chat. Public URL only —
          # the Bailian key stays in the Worker. Empty = visitors bring a key.
          NEXT_PUBLIC_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

      - name: Preserve Next.js static assets
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
